<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>Manga Dịch</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 340px; background: var(--card); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; line-height: 1.2; }
  header .sub { font-size: 11.5px; color: var(--muted); }
  .gear { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; }
  .gear:hover { background: var(--surface); }
  main { padding: 14px; display: grid; gap: 12px; }
  .site { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .site b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .box { padding: 4px 12px; border: 1px solid var(--border); border-radius: 12px; }
  .setup { text-align: center; padding: 18px 14px; border: 1px dashed var(--border); border-radius: 12px; }
  .setup p { margin: 4px 0 12px; color: var(--muted); }
  .model { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .model span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
  footer a { color: inherit; }
</style>

<header>
  <div class="logo" aria-hidden="true">MD</div>
  <div><h1>Manga Dịch</h1><div class="sub" id="sub">Dịch manga sang tiếng Việt</div></div>
  <button class="gear" id="settings" type="button" title="Cài đặt" aria-label="Mở cài đặt">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="banner" id="stale" role="alert" hidden>
    <b>Extension vừa cập nhật nhưng chưa tải lại.</b>
    Bấm nút dưới, rồi F5 trang truyện.
    <button class="btn small primary" id="reload" type="button" style="margin-top:6px">Tải lại extension</button>
  </div>

  <div class="setup" id="setup" hidden>
    <b>Chưa kết nối AI</b>
    <p>Chọn nhà cung cấp và dán API key - có lựa chọn miễn phí. Trang cài đặt mở trong tab mới nên không lo mất chữ đang gõ.</p>
    <button class="btn primary big" id="setup-go" type="button">Mở cài đặt</button>
  </div>

  <div id="ready" hidden>
    <button class="btn primary big" id="go" type="button">Dịch trang này</button>
    <button class="btn big" id="stop" type="button" hidden style="margin-top:8px">Dừng dịch tab này</button>
    <div class="model" style="margin-top:8px"><span id="model"></span><button class="linkbtn" id="change" type="button">Đổi</button></div>
  </div>

  <div class="box" id="quick" hidden>
    <label class="switch"><input type="checkbox" id="auto"><span class="track" aria-hidden="true"></span>
      <span class="txt">Tự dịch trên <span id="host">site này</span><small>Mở chapter là tự dịch, khỏi bấm lại</small></span></label>
    <label class="switch"><input type="checkbox" id="polish"><span class="track" aria-hidden="true"></span>
      <span class="txt">Trau chuốt văn phong &amp; xưng hô<small>Thêm 1 lượt gọi, câu tự nhiên hơn</small></span></label>
    <label class="switch"><input type="checkbox" id="sfx"><span class="track" aria-hidden="true"></span>
      <span class="txt">Dịch cả SFX<small>Đổi ngay trên trang, không gọi lại</small></span></label>
  </div>

  <div class="model" id="mem" hidden><span id="mem-text"></span><button class="linkbtn" id="mem-open" type="button">Xem / sửa</button></div>
</main>

<footer>
  <span>Phím tắt: Alt+Shift+D</span>
  <a href="https://github.com/SakerLy/translate-managa" target="_blank" rel="noopener">GitHub</a>
</footer>

<script src="series.js"></script>
<script src="popup.js"></script>
</html>
